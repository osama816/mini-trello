services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mini_trello_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - mini_trello_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: mini_trello_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mini_trello_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: mini_trello_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mini_trello
      MYSQL_USER: mini_trello
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mini_trello_dbdata:/var/lib/mysql
    networks:
      - mini_trello_network

networks:
  mini_trello_network:
    driver: bridge

volumes:
  mini_trello_dbdata:
    driver: local
